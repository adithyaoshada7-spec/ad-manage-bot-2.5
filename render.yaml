services:
  - type: web
    name: ad-manage-bot-2-5
    env: python
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: NVIDIA_MODEL
        value: deepseek-v4-flash-0731
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_AD_ACCOUNT_ID
        value: act_1397457568798633
      - key: META_API_VERSION
        value: v20.0
